<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OREN | Blood & Fate</title>
  <style>
    :root{--violet:#a945ff;--red:#ff264d;--ink:#07050a;--silver:#d8c9dd}
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:#fff;background:radial-gradient(circle at 22% 30%,#2a0e44 0,transparent 32%),radial-gradient(circle at 78% 45%,#400914 0,transparent 34%),#050407;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(120deg,transparent 0 80px,rgba(255,255,255,.025) 82px 84px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px clamp(18px,5vw,72px);border-bottom:1px solid #54236f;background:rgba(4,3,7,.84);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
    .brand{font-weight:900;letter-spacing:.28em;font-size:clamp(1.2rem,4vw,2rem);text-shadow:-2px 0 12px var(--violet),2px 0 12px var(--red)}
    .back{color:#e7d7ef;text-decoration:none;border:1px solid #7d438e;padding:10px 14px;border-radius:4px;background:#110918}
    .game-shell{width:min(1180px,96vw);margin:26px auto 48px;display:grid;grid-template-columns:minmax(0,850px) minmax(240px,300px);gap:22px;align-items:start}
    .board-wrap{position:relative;width:100%;aspect-ratio:1/1;background:url('oren-game-board.png') center/contain no-repeat;filter:drop-shadow(0 24px 50px #000)}
    .grid{position:absolute;left:13.2%;top:18.2%;width:72.7%;height:63.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1.5%;padding:.5%}
    .cell{border:0;background:rgba(0,0,0,.04);cursor:pointer;display:grid;place-items:center;position:relative;border-radius:7%;transition:.18s transform,.18s background}
    .cell:hover,.cell:focus-visible{outline:2px solid rgba(223,177,255,.65);background:rgba(125,37,171,.14);transform:scale(.97)}
    .cell:disabled{cursor:default}
    .mark{width:62%;height:62%;display:block;animation:arrive .34s cubic-bezier(.2,1.6,.5,1)}
    .mark.oren{border:clamp(5px,1vw,12px) solid #c45cff;border-radius:50%;box-shadow:0 0 8px #fff,0 0 22px var(--violet),inset 0 0 18px var(--violet);position:relative}
    .mark.oren:before,.mark.oren:after{content:"";position:absolute;background:#e9baff;box-shadow:0 0 12px var(--violet)}
    .mark.oren:before{width:132%;height:8%;left:-16%;top:46%}.mark.oren:after{height:132%;width:8%;top:-16%;left:46%}
    .mark.chase{position:relative;filter:drop-shadow(0 0 9px var(--red))}
    .mark.chase:before,.mark.chase:after{content:"";position:absolute;left:45%;top:-10%;height:120%;width:12%;background:linear-gradient(90deg,#6f0014,#ff4260,#8c071e);clip-path:polygon(30% 0,100% 5%,65% 49%,100% 95%,25% 100%,42% 52%,0 8%)}
    .mark.chase:before{transform:rotate(45deg)}.mark.chase:after{transform:rotate(-45deg)}
    .impact{animation:impact .35s ease}
    .side{background:linear-gradient(180deg,rgba(42,7,12,.92),rgba(8,4,10,.94));border:1px solid #7d1930;box-shadow:0 0 28px rgba(255,20,60,.16);padding:12px;border-radius:10px}
    .portrait{aspect-ratio:.78/1;background-image:url('oren-game-preview.png');background-size:335%;background-position:100% 29%;border:2px solid #a51c38;box-shadow:inset 0 0 32px #000,0 0 22px rgba(255,28,65,.3);border-radius:6px}
    .side h2{text-align:center;letter-spacing:.18em;margin:12px 0 6px;font-size:1.5rem}
    .status{min-height:82px;padding:14px 12px;margin:12px 0;border:1px solid #672033;background:#12070b;color:#f2dce1;font-size:1.06rem;line-height:1.4;text-align:center;display:grid;place-items:center}
    .controls{display:grid;gap:10px}.controls button{font:700 1rem Georgia,serif;padding:12px;border:1px solid #8a3150;color:white;background:linear-gradient(#3d0b17,#19070c);cursor:pointer}.controls button:hover{filter:brightness(1.35)}
    .score{display:flex;justify-content:space-around;color:#d7bfdc;padding:10px 0}.score b{color:#fff}
    .hint{text-align:center;color:#bda9c2;font:14px Arial,sans-serif;padding-top:8px}
    @keyframes arrive{0%{transform:scale(.1) rotate(-30deg);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes impact{40%{transform:translateX(-5px)}70%{transform:translateX(4px)}}

    .hidden{display:none!important}
    .castle-gateway,.castle-game{width:min(1180px,96vw);margin:26px auto 48px}
    .castle-gateway{position:relative;overflow:hidden;border:1px solid #5d267b;background:#09050d;box-shadow:0 24px 70px #000;border-radius:12px}
    .castle-gateway img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;filter:brightness(.78)}
    .gateway-overlay{position:absolute;inset:0;display:grid;place-content:end center;padding:clamp(22px,5vw,70px);background:linear-gradient(transparent 35%,rgba(4,1,7,.92));text-align:center}
    .gateway-overlay h1{margin:0 0 8px;letter-spacing:.13em;text-shadow:0 0 22px #9e36ff;font-size:clamp(1.7rem,5vw,3.6rem)}
    .gateway-overlay p{margin:0 0 18px;color:#e1ccea}
    .castle-btn{font:800 1rem Georgia,serif;letter-spacing:.08em;color:white;border:1px solid #a649d2;background:linear-gradient(135deg,#3a0b50,#5d0c1f);padding:13px 20px;cursor:pointer;box-shadow:0 0 18px rgba(169,69,255,.25)}
    .castle-btn:hover,.castle-btn:focus-visible{filter:brightness(1.35);outline:2px solid #efd7ff}
    .castle-stage{position:relative;overflow:hidden;border:1px solid #71318e;background:#050307;border-radius:12px;box-shadow:0 24px 70px #000}
    .castle-stage img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
    .room-hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;background:linear-gradient(90deg,#100518,#21060d);border-top:1px solid #6a2680}
    .room-name{font-weight:900;letter-spacing:.12em;font-size:clamp(1rem,3vw,1.45rem)}
    .room-count{color:#c9afd2;font-family:Arial,sans-serif}
    .room-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;background:#08050b}
    .room-controls .castle-btn{min-width:130px}
    .room-message{text-align:center;min-height:52px;padding:14px;color:#dcc6e4;background:#100715;border-top:1px solid #3c174a}
    @media(max-width:830px){.game-shell{grid-template-columns:1fr}.side{width:min(520px,94vw);margin:-28px auto 0;display:grid;grid-template-columns:120px 1fr;gap:12px}.portrait{grid-row:1/4}.side h2{text-align:left}.status{margin:0}.controls{grid-column:1/-1}.score{grid-column:1/-1}.hint{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">OREN</div><a class="back" href="index.html">← Return to OREN World</a></header>

  <section class="castle-gateway" id="castleGateway" aria-label="Find the Blood Stone castle entrance">
    <img src="castle-doors.png" alt="Ancient double doors leading into the OREN castle">
    <div class="gateway-overlay"><h1>FIND THE BLOOD STONE</h1><p>Twelve rooms. Hidden traps. One stone.</p><button class="castle-btn" id="enterCastle" type="button">Enter the Castle</button></div>
  </section>
  <section class="castle-game hidden" id="castleGame" aria-label="Find the Blood Stone">
    <div class="castle-stage"><img id="roomImage" src="castle-01-entrance-hall.png" alt="Entrance Hall"></div>
    <div class="room-hud"><div class="room-name" id="roomName">Entrance Hall</div><div class="room-count" id="roomCount">Room 1 of 12</div></div>
    <div class="room-message" id="roomMessage" aria-live="polite">The castle is silent. Search carefully.</div>
    <div class="room-controls"><button class="castle-btn" id="prevRoom" type="button">Previous Room</button><button class="castle-btn" id="nextRoom" type="button">Next Room</button><button class="castle-btn" id="exitCastle" type="button">Exit Castle</button></div>
  </section>
  <main class="game-shell">
    <section class="board-wrap" aria-label="OREN Blood and Fate game board"><div class="grid" id="grid"></div></section>
    <aside class="side">
      <div class="portrait" role="img" aria-label="Chase Walker"></div>
      <h2>CHASE</h2>
      <div class="status" id="status" aria-live="polite">Your move. Try not to embarrass yourself.</div>
      <div class="controls"><button id="soundBtn" type="button">Voice: ON</button><button id="resetBtn" type="button">Face Chase Again</button></div>
      <div class="score"><span>You <b id="youScore">0</b></span><span>Chase <b id="chaseScore">0</b></span><span>Draws <b id="drawScore">0</b></span></div>
      <p class="hint">You are the purple sigil. Chase is the red slash.</p>
    </aside>
  </main>
  <script>

    const castleRooms=[
      ['Entrance Hall','castle-01-entrance-hall.png'],['Portrait Gallery','castle-02-portrait-gallery.png'],['Library','castle-03-library.png'],['Dining Hall','castle-04-dining-hall.png'],['Kitchen','castle-05-kitchen.png'],['Armory','castle-06-armory.png'],['Chapel','castle-07-chapel.png'],['Dungeon','castle-08-dungeon.png'],['Tower Staircase','castle-09-tower-staircase.png'],['Upper Chamber','castle-10-upper-chamber.png'],['Hidden Passage','castle-11-hidden-passage.png'],['Stone Chamber','castle-12-stone-chamber.png']
    ];
    const castleGateway=document.querySelector('#castleGateway'),castleGame=document.querySelector('#castleGame'),chaseGame=document.querySelector('.game-shell');
    const roomImage=document.querySelector('#roomImage'),roomName=document.querySelector('#roomName'),roomCount=document.querySelector('#roomCount'),roomMessage=document.querySelector('#roomMessage');
    let roomIndex=0;
    function showRoom(index){roomIndex=(index+castleRooms.length)%castleRooms.length;const room=castleRooms[roomIndex];roomImage.src=room[1];roomImage.alt=room[0];roomName.textContent=room[0];roomCount.textContent='Room '+(roomIndex+1)+' of '+castleRooms.length;roomMessage.textContent=roomIndex===0?'The castle is silent. Search carefully.':'A faint aura lingers here. The Blood Stone may be nearer—or farther away.';}
    document.querySelector('#enterCastle').addEventListener('click',()=>{castleGateway.classList.add('hidden');chaseGame.classList.add('hidden');castleGame.classList.remove('hidden');showRoom(0);window.scrollTo({top:0,behavior:'smooth'});});
    document.querySelector('#prevRoom').addEventListener('click',()=>showRoom(roomIndex-1));
    document.querySelector('#nextRoom').addEventListener('click',()=>showRoom(roomIndex+1));
    document.querySelector('#exitCastle').addEventListener('click',()=>{castleGame.classList.add('hidden');castleGateway.classList.remove('hidden');chaseGame.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});});
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const grid=document.querySelector('#grid'),statusEl=document.querySelector('#status');
    const resetBtn=document.querySelector('#resetBtn'),soundBtn=document.querySelector('#soundBtn');
    const youScore=document.querySelector('#youScore'),chaseScore=document.querySelector('#chaseScore'),drawScore=document.querySelector('#drawScore');
    const score={you:0,chase:0,draw:0}; let cells=Array(9).fill(''),locked=false,sound=true;
    for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',`Square ${i+1}`);b.addEventListener('click',()=>playerMove(i));grid.append(b)}
    function winner(mark){return wins.find(line=>line.every(i=>cells[i]===mark))}
    function draw(){return cells.every(Boolean)}
    function place(i,mark){cells[i]=mark;const m=document.createElement('span');m.className=`mark ${mark}`;grid.children[i].append(m);grid.children[i].disabled=true;if(mark==='chase')grid.children[i].classList.add('impact')}
    function playerMove(i){if(locked||cells[i])return;place(i,'oren');if(finish('oren'))return;locked=true;statusEl.textContent='Chase is choosing where to strike…';setTimeout(chaseMove,520)}
    function chaseMove(){let pick=bestMove();place(pick,'chase');if(finish('chase'))return;playMoveVoice();locked=false;statusEl.textContent='Your turn. Chase is waiting.'}
    function bestMove(){for(const m of ['chase','oren'])for(const line of wins){const open=line.filter(i=>!cells[i]);const owned=line.filter(i=>cells[i]===m);if(open.length===1&&owned.length===2)return open[0]}if(!cells[4])return 4;const corners=[0,2,6,8].filter(i=>!cells[i]);if(corners.length)return corners[Math.floor(Math.random()*corners.length)];const open=cells.map((v,i)=>v?'':i).filter(v=>v!=='');return open[Math.floor(Math.random()*open.length)]}
    function finish(mark){const line=winner(mark);if(line){locked=true;line.forEach(i=>grid.children[i].style.background=mark==='oren'?'rgba(147,42,211,.3)':'rgba(190,18,48,.3)');if(mark==='oren'){score.you++;statusEl.textContent='You beat Chase. He will not take that quietly.'}else{score.chase++;statusEl.textContent='Chase wins this round.';playChaseAudio(chaseWinAudio)}updateScore();return true}if(draw()){locked=true;score.draw++;statusEl.textContent='A draw. Chase demands another round.';updateScore();return true}return false}
    const chaseMoveAudio=['chase-bad-move.mp3','chase-keep-trying.mp3','chase-that-was-weak.mp3','chase-all-day.mp3'].map(src=>new Audio(src));
    const chaseWinAudio=new Audio('chase-winner.mp3');
    const allChaseAudio=[...chaseMoveAudio,chaseWinAudio];
    let chaseMoveIndex=0;
    allChaseAudio.forEach(clip=>clip.preload='auto');
    function stopChaseAudio(){allChaseAudio.forEach(clip=>{clip.pause();clip.currentTime=0})}
    function playChaseAudio(clip){if(!sound)return;stopChaseAudio();clip.play().catch(()=>{})}
    function playMoveVoice(){playChaseAudio(chaseMoveAudio[chaseMoveIndex]);chaseMoveIndex=(chaseMoveIndex+1)%chaseMoveAudio.length}
    
    function updateScore(){youScore.textContent=score.you;chaseScore.textContent=score.chase;drawScore.textContent=score.draw}
    function reset(){stopChaseAudio();cells=Array(9).fill('');locked=false;chaseMoveIndex=0;[...grid.children].forEach(b=>{b.innerHTML='';b.disabled=false;b.classList.remove('impact');b.style.background=''});statusEl.textContent='Your move. Try not to embarrass yourself.'}
    resetBtn.addEventListener('click',reset);soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=`Voice: ${sound?'ON':'OFF'}`;if(!sound)stopChaseAudio()});
  </script>
</body>
</html>
